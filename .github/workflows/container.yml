name: Container image

# Pull requests that touch the image only build and smoke-test it.
# Publishing to GHCR happens only when a v* tag is pushed.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - server/**
      - .github/workflows/container.yml

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test the image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: chrome-session-sync:ci

      - name: Start the hub and check it answers
        run: |
          docker run -d --name hub -p 127.0.0.1:8787:8787 -v hub-data:/data chrome-session-sync:ci
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 10 --retry-delay 1 --retry-all-errors http://127.0.0.1:8787/)
          docker logs hub
          test "$code" = "404"
          test "$(docker exec hub id -u)" != "0"
          docker exec hub node server/standalone.mjs --dir /data --pair > /dev/null

  publish:
    name: Build and push to GHCR
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # GHCR needs a lower-case name. A pre-release tag such as v1.2.0-rc1 does not move :latest.
      - name: Work out the image tags
        id: tags
        run: |
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          tags="${image}:${GITHUB_REF_NAME}"
          case "${GITHUB_REF_NAME}" in
            *-*) ;;
            *) tags="${tags},${image}:latest" ;;
          esac
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
