name: Release extension

# Runs only when a v* tag is pushed. It never runs on pull requests.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Zip and publish the extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the manifest version
        run: |
          version=$(jq -r .version extension/manifest.json)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the manifest version ${version}."
            exit 1
          fi

      - name: Build the zip and checksum
        run: |
          (cd extension && zip -r "../chrome-session-sync-${GITHUB_REF_NAME}.zip" .)
          sha256sum "chrome-session-sync-${GITHUB_REF_NAME}.zip" > "chrome-session-sync-${GITHUB_REF_NAME}.zip.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "chrome-session-sync-${GITHUB_REF_NAME}.zip" \
            "chrome-session-sync-${GITHUB_REF_NAME}.zip.sha256" \
            --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
